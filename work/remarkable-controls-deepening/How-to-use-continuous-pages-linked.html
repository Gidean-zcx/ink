<script>
(function (window, document) {
    'use strict';

    let isMIAWReady = false;

    // 1. Listen for the official Ready event
    window.addEventListener("onEmbeddedMessagingReady", () => {
        isMIAWReady = true;
    });

    // 2. The Main Listener
    window.addEventListener('startChat', (event) => {
		const rawData = event?.detail?.formData;

    	if (!rawData || !rawData._email || !rawData._firstName) {
	        console.error('HEADER >> ❌ Validation Failed: Missing required form data.');
        	// Optional: Dispatch a 'chatError' event back to the LWC to show a UI toast
    	    return; 
	    }
        
        const formData = event.detail.formData;
        let attempts = 0;
        const maxAttempts = 60; // 60 * 100ms = 6 seconds max wait

        // Define the launch function
        const attemptLaunch = () => {
            if (isMIAWReady) {
                console.log('HEADER >> 🚀 API is ready, launching now...');
                launch(formData);
            } else if (attempts < maxAttempts) {
                attempts++;

                setTimeout(attemptLaunch, 100); // Re-check in 100ms
            } else {
                console.error('HEADER >> ❌ MIAW failed to initialize in time.');
            }
        };

        attemptLaunch();
    });

    var blockReAttempt = false;
    // 3. The Actual Logic Execution
    function launch(data) {
        if(blockReAttempt === true){
        	console.warn('Trying to re-start chat to quickly.');
        	return;
        }
        
        try {
	        blockReAttempt = true;
            // Unset/Clean slate (as discussed previously)
            embeddedservice_bootstrap.prechatAPI.setHiddenPrechatFields({});

            // Map and Set Fields
            embeddedservice_bootstrap.prechatAPI.setHiddenPrechatFields({
                "Hidden_First_Name": data._firstName,
                "Hidden_Last_Name": data._lastName,
                "Hidden_Email": data._email,
                "Product": data.Product,
                "ConnectSubscription": data.ConnectSubscription,
                "Hidden_Level1": data['I have a question about'],
                "ButtonType": data.ButtonType
            });
    
    		console.log(JSON.stringify(data));

            // Final safety buffer before UI launch
            setTimeout(() => {
                embeddedservice_bootstrap.utilAPI.launchChat();
                blockReAttempt = false;
            }, 200);
            
        } catch (err) {
            console.error('HEADER >> ❌ Error during launch phase:', err);
		    blockReAttempt = false;
        }
    }
})(window, document);

<style id="themeCSS"></style><style id="customCSS">/* Mobile header logo */
@media only screen and (max-width: 767px) {
    .forceCommunityThemeHeaderCompact .themeLogo {
        left: 50% !important;
    }
    .forceCommunityThemeHeaderCompact .themeLogo .logoImage{
        width: min(70vw, 192px) !important;
        /* max-height: unset !important; */
        height: 48px !important;
    }
}

.themeLogo {
    border-bottom: 0px !important;
}

.themeLogo:hover {
    text-decoration: none !important;
    border-bottom: 0px !important;
}

.forceCommunityThemeLogo, .logoImage {
    width: 254px !important;
    height: 32px !important;
}

/* Min margin of 80px on each side */
@media (min-width: 1024px){
    .siteforceThemeLayoutStarter > div.body.isPageWidthFixed-true{
        max-width: calc(100% - 80px * 2);
    }
}

/* font smoothing fix */
body{
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
}

/* Hide "Home" in header */
.themeHeader nav > ul > li:first-child{
    display: none;
}

/* Search page */
/* hide the empty content header, left column and the sorting */
.comm-page-global-search .comm-content-header,
.comm-page-global-search .forceCommunitySearch > div:first-child,
.comm-page-global-search .sortingInfo,
.comm-page-global-search .searchResultsGridHeader h2,
.comm-page-global-search .forceSearchQueryExpansionMessage lightning-icon{
    display: none;
}
.comm-page-global-search .forceSearchQueryExpansionMessage{
    margin-top: 2rem;
    font-family: SansMedium;
}
.comm-page-global-search .contentRegion{
    padding-top: 0 !important;
}
.comm-page-global-search .forceSearchSearchResultsGridHeader{
    border-bottom: 2px solid #211E1C4D;
    padding-left: 0;
    padding-right: 0;
}
.comm-page-global-search .searchResultsGridHeader .searchResultsSummary{
    font-family: SansMedium;
    font-size: 1.125rem;
    line-height: 1.5;
}
.comm-page-global-search .body{
    max-width: 100% !important;
    margin: 0 auto !important;
}
.forceSearchResultsList .slds-tile {
	max-width: none !important;
}
.comm-page-global-search .forceSearchResultsRegion .scroller{
    background: none !important;
}
.comm-page-global-search .forceSearchResultsRegion ul > li{
    background-color: transparent;
    padding: 0.625rem 0;
    border-bottom: none !important;
}
.comm-page-global-search .forceSearchResultsRegion ul > li .resultBody{
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}
.comm-page-global-search .forceSearchResultsRegion ul li a{
	color: #1040DD;
}
.comm-page-global-search .forceSearchResultsRegion ul li a > span{
    color: inherit;
    text-decoration-style: solid;
}
.comm-page-global-search .forceSearchResultsRegion mark{
	background-color: #FECDA0;
}
.comm-page-global-search .forceSearchResultsRegion .kbStencilRecord{
    margin-left: 0;
}
.comm-page-global-search .forceSearchResultsRegion .listContent{
    margin: 0.625rem 0;
}
.comm-page-global-search .forceSearchResultsRegion > div > div > div > button,
.comm-page-global-search .forceSearchResultsRegion > div > div > div > div > button{
    /* Show more button */
    float: right;
    background: none;
    border: none;
    font-family: SansMedium;
    color: black;
    font-size: 0.875rem;
    line-height: 1.5;
    text-decoration: underline;
}
.comm-page-global-search .forceSearchResultsRegion > div > div > div > button:hover,
.comm-page-global-search .forceSearchResultsRegion > div > div > div > div > button:hover{
    text-decoration-thickness: 2px;
}

@media (min-width: 992px) {
    .comm-page-global-search .searchResultsGridHeader .searchResultsSummary{
        font-size: 1rem;
    }
    .comm-page-global-search .forceSearchResultsRegion ul > li{
        padding: 1rem 0;
    }
    .comm-page-global-search .forceSearchResultsRegion ul > li .resultBody {
        -webkit-line-clamp: 1;
    }
    .comm-page-global-search .forceSearchResultsRegion .listContent{
        margin: 1rem 0;
    }
    .comm-page-global-search .forceSearchResultsRegion .uiAbstractList {
    	margin-left: 1rem !important;
    }
}
@media (max-width: 767px) {
    .comm-page-global-search .body .contentRegion{
        padding: 0;
    }
    .comm-page-global-search .forceSearchResultsRegion{
        padding: 0 2rem;
    }
}
/* Einstein AI Search result */
.comm-page-global-search search_results-qna-viewer{
    margin-bottom: 0 !important;
}
.comm-page-global-search .forceCommunitySearch .resultsWrapper{
    overflow: unset;
}
.qna-viewer__content{
    background-color: #F3EFE7;
    padding: 1rem 0;
    box-shadow: 0 0 0 100vmax #F3EFE7;

}

/* NEW BUTTONS AUG 2024 */
/* when using the button classes, use .rm-button together with a theme (e.g. ".rm-button-primary") and a size (e.g. ".rm-button-large") */
/* e.g. <button class="rm-button rm-button-primary rm-button-large"> */
/* to get arrow in the button, insert a span within the button element, e.g <button class="...">Text<span class="rm-button-arrow"></span></button> */
.rm-button{
    display: block;
    width: fit-content;
    background: none;
    border: none;
    font-family: SansSemiBold;
    font-size: 18px;
    line-height: 1;
    padding: 15px 20px;
    border-radius: 2px;
    cursor: pointer;
    text-decoration: none;
    transition: all .1s ease-out;
}
.rm-button-large{
    /* same as default styles in .rm-button */
    font-size: 18px;
    line-height: 1;
    padding: 15px 20px;
}
.rm-button-medium{
    font-size: 16px;
    line-height: 1;
    padding: 15px 20px;
}
.rm-button-small{
    font-size: 14px;
    line-height: 1;
    padding: 9px 12px;
}

.rm-button-primary{
    background-color: #2559F4;
    color: #FCFBF8;
}
.rm-button-primary:hover{
    background-color: #1142D4;
    color: #FCFBF8 !important;
}
.rm-button-primary:active{
    background-color: #003BB2;
}
.rm-button-primary-neutral{
    background-color: #211E1C;
    color: #FCFBF8;
}
.rm-button-primary-neutral:hover{
    background-color: #37322F;
    color: #FCFBF8 !important;
}
.rm-button-primary-neutral:active{
    background-color: #4D4542;
}
.rm-button-secondary{
    background-color: transparent;
    color: #211E1C;
    border: 1px solid #6E635E;
}
.rm-button-secondary:hover{
    color: #1142D4 !important;
    border-color: #1142D4;
}
.rm-button-secondary:active{
    color: #003BB2;
    border-color: #003BB2;
}
.rm-button-tertiary{
    background-color: #211E1C1A;
    color: #211E1C;
}
.rm-button-tertiary:hover{
    background-color: #211E1C26;
}
.rm-button-tertiary:active{
    background-color: #211E1C33;
}
.rm-button-tertiary-neutral{
    background-color: #FCFBF8;
    color: #211E1C;
}
.rm-button-tertiary-neutral:hover{
    background-color: #211E1C1A;
}
.rm-button-tertiary-neutral:active{
    background-color: #211E1C26;
}

.rm-button:hover,
.rm-button:focus{
    text-decoration: none !important;
}
.rm-button:disabled{
    opacity: 0.3;
}
.rm-button:disabled:focus-visible,
.rm-button:disabled:hover{
    background-color: inherit;
    color: inherit;
    filter: opacity(0.3);
}
.rm-button:focus-visible{
    background-color: #99C3FF;
    color: #211E1C;
}

.rm-button-arrow{
    position: relative;
    width: 18px;
    height: 2px;
    background-color: #FCFBF8;
    display: inline-block;
    margin-left: 15px;
    translate: 0 -5px;
    border-radius: 1px;
}
.rm-button-arrow::before,
.rm-button-arrow::after{
    content: "";
    position: absolute;
    top: 0;
    right: 0;
    width: 11px;
    height: 2px;
    background-color: inherit;
    border-radius: 1px;
    transition: all .1s ease-out;
}
.rm-button-arrow::before{
    rotate: 45deg;
    translate: 2px -3.5px;
    transition: all .1s ease-out;
}
.rm-button-arrow::after{
    rotate: -45deg;
    translate: 2px 3.5px;
    transition: all .1s ease-out;
}
.rm-button-medium .rm-button-arrow{
    width: 15px;
    margin-left: 12.5px;
}
.rm-button-medium .rm-button-arrow::before,
.rm-button-medium .rm-button-arrow::after{
    width: 9px;
}
.rm-button-medium .rm-button-arrow::before{
    translate: 1px -3px;
}
.rm-button-medium .rm-button-arrow::after{
    translate: 1px 3px;
}
.rm-button-small .rm-button-arrow{
    width: 12px;
    margin-left: 10px;
    height: 1px;
}
.rm-button-small .rm-button-arrow::before,
.rm-button-small .rm-button-arrow::after{
    width: 7px;
    height: 1px;
}
.rm-button-small .rm-button-arrow::before{
    translate: 1px -2.2px;
}
.rm-button-small .rm-button-arrow::after{
    translate: 1px 2.2px;
}

.rm-button-primary .rm-button-arrow,
.rm-button-primary-neutral .rm-button-arrow{
    background-color: #FCFBF8;
}
.rm-button-secondary .rm-button-arrow,
.rm-button-tertiary .rm-button-arrow,
.rm-button-tertiary-neutral .rm-button-arrow{
    background-color: #211E1C;
}
.rm-button-secondary:hover .rm-button-arrow{
    background-color: #1142D4;
}
