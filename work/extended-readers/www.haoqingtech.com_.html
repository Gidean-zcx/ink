<style id="vvvebjs-styles">#language-btn {margin-top: 10px;}</style></head>
	
  <body data-aos-easing="ease" data-aos-duration="400" data-aos-delay="0">

   <header class="header clearfix container" id="top-header" data-aos="zoom-in" data-aos-delay="100">
	<div class="container">
         <nav>
          <ul class="nav nav-pills float-end">
            <li class="nav-item">
              <a class="nav-link active" href="#" id="language-btn" onclick="myFunction()"> EN </a>
            </li>
          </ul>
        </nav>
         <h3 class="text-muted"><img src="logo.png" class="mw-100" width="200" height="55"><br></h3>

      <section class="jumbotron container bg-light p-4" id="jumbotron"><img src="zh.png" class="mw-100"id="content-img">
	
      </section>

      

	<script>
    var languageIndex = 0;
    function myFunction()
    {
      btn=document.getElementById("language-btn");  // 找到元素
      img=document.getElementById("content-img");
      if(languageIndex == 0){
        btn.innerHTML=" CN ";
        img.src="en1.png"
        languageIndex = 1;
      }else {
        btn.innerHTML=" EN ";
        img.src="zh.png"
        languageIndex = 0;
      }
    }
		AOS.init();
	</script>
