<script>
var windowURL = String(window.location); 
var newLang = ""; 
var langMap = new Map();

langMap.set("help.audible.com", ["en_US","es_US","es_MX"]); 
langMap.set("help.audible.in", ["en_IN","hi"]);

langMap.set("ajuda.audible.com.br", ["pt_BR"]);

var arr0 = String(window.location.hostname).toLowerCase(); 
newLang = langMap.get(arr0);

function getCookie(name) {
    var match = document.cookie.match(new RegExp('(?:^|;\\s*)' + name + '=([^;]*)'));
    return match ? decodeURIComponent(match[1]) : null;
}

var lopAdblLang = getCookie('lopAdbl');

var url = new URL(windowURL);
var searchParams = url.searchParams;

var currentLang = searchParams.get('language'); 
if(newLang != undefined){
    const lowercaseLang = newLang.map(newLang => newLang.toLowerCase());
    var targetLang = newLang[0];
    if(lopAdblLang && lowercaseLang.includes(lopAdblLang.toLowerCase())){
        targetLang = lopAdblLang;
    }
    if(currentLang == undefined || currentLang == "" || !lowercaseLang.includes(currentLang.toLowerCase()) || (lopAdblLang && currentLang !== targetLang && lowercaseLang.includes(lopAdblLang.toLowerCase())))
     {     
         searchParams.set('language', targetLang);     
         url.search = searchParams.toString();     
         var newUrl = url.toString();     
         window.location = newUrl;
     }  
}
        
</script>

/*Padding for Breadcrumbs on Custom topic Page and Standard topic detail page*/
nav.forceCommunityBreadcrumbs {
    padding: 0px 0px 0px 18px;
 }
 
 /*Padding for Breadcrumbs on Article Page*/
 /* This CSS overrides above padding ONLY on Article Page */
 body.comm-page-article nav.forceCommunityBreadcrumbs {
    padding: 0px 0px 0px 24px;
 } 

/* Adding to align topic heading at left at topic detail page (Standard) */
.forceCommunityHeadline .headlineTitle {
    text-align: left !important;
    font-size: 36px !important;
    line-height: 42px !important;
    font-weight: var(--lwc-fontWeightBold, 700);
    padding: 0 18px 0px 18px!important;
    color: #010E19 !important;
}
@media only screen and (max-width: 767px) {
    .forceCommunityHeadline .headlineTitle {
        font-size: 24px !important;
        line-height: 30px !important;
    }
}
/* Adding padding to topic description at topic detail page (Standard) */
.forceCommunityTopicDescription {
    padding: 0px 0px 0px 18px !important;
}
/* Adding to format topic description at topic detail page */
.forceCommunityTopicDescription .topicDescription{
    color: #141414 !important;

    letter-spacing: 0;
    line-height: 36px;
