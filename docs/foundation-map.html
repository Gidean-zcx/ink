<style>
/* Layout: a device "board" (layers stacked like a PCB stack-up) beside the hub column; a detail sheet under the map; scenario stepper lights up the blocks involved; plan timeline at the end. */
:root {
  --paper: #e8eae5; --sheet: #f4f5f1; --ink: #1b1d1a; --ink-2: #4a4f48; --rule: #c7cbc2;
  --accent: #1f5a6b; --accent-soft: #d6e3e5; --hot: #8a3b12; --hot-soft: #f3dfd2;
  --ok: #2f6b3a; --ok-soft: #dbe9dc; --warn: #8a5a12; --warn-soft: #f1e5cc;
  --display: "Noto Serif SC", "Songti SC", "SimSun", serif;
  --body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #171916; --sheet: #20231f; --ink: #e6e8e2; --ink-2: #a9aea5; --rule: #3a3e37;
  --accent: #7fb6c4; --accent-soft: #24393f; --hot: #f0a27a; --hot-soft: #3d281d;
  --ok: #8cc496; --ok-soft: #22362a; --warn: #e0b46a; --warn-soft: #3b3020; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #171916; --sheet: #20231f; --ink: #e6e8e2; --ink-2: #a9aea5; --rule: #3a3e37;
  --accent: #7fb6c4; --accent-soft: #24393f; --hot: #f0a27a; --hot-soft: #3d281d;
  --ok: #8cc496; --ok-soft: #22362a; --warn: #e0b46a; --warn-soft: #3b3020; color-scheme: dark }
body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.65; }
.wrap { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 72px; display: grid; gap: 32px; }
h1 { font-family: var(--display); font-weight: 900; font-size: clamp(30px, 6vw, 46px); line-height: 1.15; margin: 0; letter-spacing: .02em; text-wrap: balance; }
h2 { font-family: var(--display); font-weight: 600; font-size: 21px; margin: 0; text-wrap: balance; }
h3 { font-size: 16px; margin: 0; font-weight: 700; }
p { margin: 0; }
.mono { font-family: var(--mono); font-size: 12px; letter-spacing: .04em; }
.lede { color: var(--ink-2); max-width: 66ch; }
section { display: grid; gap: 14px; }
header { display: grid; gap: 10px; }

/* the map */
.map { display: grid; grid-template-columns: minmax(0, 3fr) 56px minmax(0, 1.35fr); gap: 0; align-items: stretch; }
.col { display: grid; gap: 8px; align-content: start; min-width: 0; }
.col-title { font-family: var(--mono); font-size: 12px; color: var(--ink-2); letter-spacing: .08em; padding: 0 2px 4px; }
.layer { border: 1px solid var(--rule); background: var(--sheet); padding: 8px; display: grid; gap: 6px; }
.layer-name { font-size: 11px; color: var(--ink-2); font-family: var(--mono); letter-spacing: .06em; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: inherit; font-size: 13px; line-height: 1.35; text-align: left; color: var(--ink); background: var(--paper); border: 1.5px solid var(--rule); padding: 6px 9px; cursor: pointer; min-width: 0; }
.chip:hover { border-color: var(--ink-2); }
.chip:focus-visible, .scn button:focus-visible, .step:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.chip[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--paper); }
.chip.lit { border-color: var(--hot); box-shadow: inset 0 -3px 0 var(--hot); }
.chip.lit[aria-pressed="true"] { box-shadow: inset 0 -3px 0 var(--hot-soft); }
.chip .tag { font-family: var(--mono); font-size: 10px; color: var(--accent); display: block; }
.chip[aria-pressed="true"] .tag { color: var(--accent-soft); }
.link { display: grid; place-items: center; position: relative; }
.link::before { content: ""; position: absolute; top: 24px; bottom: 0; left: 50%; border-left: 2px dashed var(--accent); }
.link button { position: relative; writing-mode: vertical-rl; font: inherit; font-size: 12px; letter-spacing: .2em; background: var(--accent-soft); color: var(--accent); border: 1.5px solid var(--accent); padding: 10px 4px; cursor: pointer; }
.link button[aria-pressed="true"] { background: var(--accent); color: var(--paper); }
.link button.lit { box-shadow: 0 0 0 3px var(--hot-soft); }
@media (max-width: 760px) {
  .map { grid-template-columns: minmax(0, 1fr); gap: 10px; }
  .link::before { display: none; }
  .link button { writing-mode: horizontal-tb; letter-spacing: .05em; width: 100%; padding: 8px; }
}

/* detail */
.detail { background: var(--sheet); border: 1px solid var(--rule); border-top: 4px solid var(--ink); padding: 18px; display: grid; gap: 14px; }
.detail-head { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; }
.detail-head h3 { font-family: var(--display); font-size: 20px; font-weight: 600; }
.facets { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px 22px; }
.facet { display: grid; gap: 4px; min-width: 0; }
.facet b { font-size: 12px; color: var(--ink-2); font-weight: 500; letter-spacing: .04em; }
.facet p, .facet li { font-size: 14px; }
.facet ul { margin: 0; padding-left: 18px; }
.pill { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); margin: 0 4px 4px 0; font-family: var(--mono); }
.status { font-size: 12px; padding: 2px 10px; border-radius: 999px; }
.st-new { background: var(--accent-soft); color: var(--accent); }
.st-port { background: var(--ok-soft); color: var(--ok); }
.st-later { background: var(--warn-soft); color: var(--warn); }

/* scenarios */
.scn { display: flex; flex-wrap: wrap; gap: 6px; }
.scn button { font: inherit; font-size: 13px; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--rule); background: transparent; color: var(--ink); cursor: pointer; }
.scn button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.steps { display: grid; gap: 6px; counter-reset: s; }
.step { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 10px; align-items: start; text-align: left; font: inherit; color: var(--ink); background: var(--sheet); border: 1px solid var(--rule); padding: 9px 12px; cursor: pointer; }
.step::before { counter-increment: s; content: counter(s); font-family: var(--mono); font-size: 12px; color: var(--ink-2); border: 1px solid var(--rule); border-radius: 50%; width: 26px; height: 26px; display: grid; place-items: center; }
.step[aria-current="true"] { border-color: var(--hot); background: var(--hot-soft); }
.step[aria-current="true"]::before { border-color: var(--hot); color: var(--hot); }
.step small { display: block; color: var(--ink-2); font-size: 12px; margin-top: 2px; }
.scn-note { font-size: 13px; color: var(--ink-2); }

/* timeline */
.plan { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.wk { border-top: 4px solid var(--rule); padding: 10px 8px 6px; display: grid; gap: 6px; align-content: start; min-width: 0; }
.wk.hw { border-color: var(--hot); }
.wk b { font-size: 13px; }
.wk .mono { color: var(--ink-2); }
.wk ul { margin: 0; padding-left: 16px; font-size: 13px; color: var(--ink); }
@media (max-width: 760px) { .plan { grid-template-columns: minmax(0, 1fr); } }
.foot { font-size: 12px; color: var(--ink-2); }
a { color: var(--accent); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script>
const LEDE = "第一版的“底座”是以后所有功能都站在上面、后期改动代价很高的那部分。设备做“薄而可靠的执行者”，家庭中枢做“厚的编排者”。下面每一块都标了：它负责什么、服务哪条需求、借鉴了谁、首版做到哪一步。";

const DEVICE_LAYERS = [
  { name: "工具（内置 app）· 同一时刻只有一个在前台", ids: ["app-read","app-listen","app-news","app-ai","app-memo","app-words","app-member"] },
  { name: "系统壳", ids: ["sh-lock","sh-home","sh-cc","sh-inbox","sh-aikey","sh-confirm"] },
  { name: "能力层（G-002 的入口）", ids: ["cap-actions","cap-snapshot","cap-policy","cap-receipt"] },
  { name: "系统服务 · 常驻 · 只用消息通信", ids: ["svc-refresh","svc-input","svc-audio","svc-data","svc-link","svc-modem","svc-power","svc-time","svc-jobs","svc-trace"] },
  { name: "硬件抽象层", ids: ["hal"] },
  { name: "驱动（从上游移植）", ids: ["drv-epd","drv-touch","drv-light","drv-audio","drv-storage","drv-wifi","drv-nt26"] }
];
const HUB_LAYERS = [
  { name: "中枢模块", ids: ["hub-acct","hub-replica","hub-agent","hub-content"] },
  { name: "外部服务", ids: ["hub-ext"] }
];

const C = {
  "app-read": {n:"阅读", tag:"新写", st:"new", what:"书架与阅读页：设备格式解析、中文排版与页缓存、语义定位器、书签笔记、选区菜单（问 AI、查词、加入单词本）。", why:["R-017","R-031","F-13"], learn:"CrossPoint：页缓存以内容哈希+排版设置为 key、带格式版本；位置记（章节，码点偏移），页码只是派生值。Metalio 原厂：主机端转换 .ebook，运行峰值内存 < 64 KB。", v01:"EPUB/TXT 经中枢转换后可读；字号、目录、书签、进度；选区三个动作。", risk:"中文排版速度与字库占用（SP-05）。"},
  "app-listen": {n:"听", tag:"新写", st:"new", what:"有声书、TTS 朗读、儿童故事；继续上次、读听切换（跟随/分离两种状态）、睡眠计时。", why:["R-018","R-031","R-032"], learn:"Readwise/Kindle：读听切换要有“回到正在播放的段落”和“从此处播放”两个动作；AntennaPod：按暂停时长回退几秒。", v01:"本地与已下载音频；中枢生成的 TTS 带句子对齐；孩子“继续上次的故事”。", risk:"音频与刷新、网络并发时是否断音（SP-02）。"},
  "app-news": {n:"报纸", tag:"新写", st:"new", what:"每日个人报纸：固定条目表、有终点、读完显示结束页；每条可追问、看来源、加入专题。", why:["R-020","G-001"], learn:"Espresso 历史版本读完出现结束页；Reader 的“下一批/结束”控制；Ground 多来源对照。", v01:"中枢生成结构化期号，设备原生渲染；读完即结束，不自动续推。", risk:"选题与来源标准未定（在中枢侧调整，不影响底座）。"},
  "app-ai": {n:"AI 助手", tag:"新写", st:"new", what:"AI 回答卡与任务卡：按句上屏、回看不跳到底、跨 app 任务显示真实阶段与结果入口。", why:["G-002","R-006","R-007"], learn:"Kindle：AI 产物先预览再决定插入或放弃；Shortcuts：通知不等于确认，回执后还要回读对象。", v01:"任意页面唤起的问答；内置工具的动作调用；回执与撤销。", risk:"4G 下首音时延（SP-04）。"},
  "app-memo": {n:"备忘", tag:"新写", st:"new", what:"随口记、提醒；备忘/待办/提醒/日程四类分开，草稿→确认→已排程→已触发→已处理。", why:["R-015","R-032"], learn:"AiPaper：自然语言先变成可编辑字段，确认后才成为日程。", v01:"语音或输入记录；本地排程的提醒（不依赖网络推送）。", risk:"—"},
  "app-words": {n:"单词", tag:"新写", st:"new", what:"生词本与间隔复习；卡片与复习日志分开；带语境（原句与定位器）。", why:["R-015","R-032"], learn:"Anki：卡片状态（新/学习/复习/暂埋/停用）与复习日志（评分、模式、是否揭示答案）分开；排程算法可替换。", v01:"离线复习闭环；从阅读选区加入。", risk:"—"},
  "app-member": {n:"成员与设置", tag:"新写", st:"new", what:"成员档案、儿童策略、设置（期望值/实际值/作用范围）、备份状态（本地已保存/等待上传/中枢已收到）。", why:["R-030","R-023"], learn:"Kindle Household：最多 4 个儿童档案，家长选书，笔记互不可见，就寝时间；BOOX：设置的作用范围（单 app/全局）要明确。", v01:"成员管理、PIN、儿童策略开关、手动备份与恢复入口。", risk:"—"},
  "sh-lock": {n:"锁屏与成员切换", tag:"新写", st:"new", what:"显示成员头像；儿童直接进入，成人需 PIN；切换时先落盘、再换数据分区、再全刷。", why:["R-030","SR-MB-01..05"], learn:"孩子识字，一个按钮挡不住；声纹不作授权依据（AI 协议研究）。", v01:"成员切换 ≤ 2 s。", risk:"—"},
  "sh-home": {n:"主页", tag:"新写", st:"new", what:"稳定位置的少量入口、“继续读/听/学”、搜索；入口不因推荐自动挪动。", why:["R-010","G-001"], learn:"墨水屏 UI 研究：稳定布局，不靠浅灰区分状态。", v01:"每位成员各自的主页。", risk:"—"},
  "sh-cc": {n:"控制中心", tag:"新写", st:"new", what:"顶边下拉或点状态栏：亮度/冷暖、音量（分通道）、网络、手动全刷、成员切换；显示实际生效值。", why:["R-010","SR-PL-07"], learn:"BOOX 控制中心与刷新档位；HiBy：短按切换、长按进设置。", v01:"固定面板，不做跟手动画。", risk:"手势与正文选择冲突。"},
  "sh-inbox": {n:"通知收件箱", tag:"新写", st:"new", what:"一般消息集中到收件箱；来电/闹钟走系统打断通道。", why:["R-010","R-013"], learn:"墨水屏研究：弹窗用不透明面板，避免频繁打断。", v01:"下载完成、报纸就绪、提醒。", risk:"—"},
  "sh-aikey": {n:"AI 键", tag:"新写", st:"new", what:"任何前台都可用；按住说话、松开结束；150 ms 内振动或提示音，随后局部刷新显示“正在听”（墨水屏快刷本身约 0.2–0.3 s）；同时预连中枢并发送页面快照。", why:["R-012","G-002"], learn:"xiaozhi：按键说话（manual）与 abort 打断；Audible 内的 Alexa 只在前台可用，是反例。", v01:"Plus 没有专门的 AI 键：建议用直连 GPIO 的 BOOT 键按住说话，翻页交给盖板虚拟键（D-19）；唤醒词以后再说（D-17）。", risk:"BOOT 若是启动 strapping 引脚，按住时遇复位会进下载模式（待核实）；S31 本地唤醒未验证。"},
  "sh-confirm": {n:"系统确认卡", tag:"新写", st:"new", what:"需要确认的动作由设备弹出确认卡，外框是页面无法模仿的系统样式。", why:["G-002","SR-AI-02"], learn:"A2UI 研究：生成的页面不得冒充系统对话框；Apple requestConfirmation。", v01:"删除、批量修改、外部副作用动作。", risk:"—"},
  "cap-actions": {n:"动作注册表", tag:"新写", st:"new", what:"每个用户可见操作登记为动作：参数、返回、副作用等级、确认策略、儿童是否可用。按钮与 AI 调用同一个动作。", why:["G-002","R-007","R-009","F-05"], learn:"KOReader Dispatcher：全局动作注册表同时绑定手势与热键；Apple App Intents；上游 Plus 实际只向 AI 开放 2 个工具（设备状态、音量）。", v01:"内置工具的全部动作；清单可序列化发给中枢。", risk:"—"},
  "cap-snapshot": {n:"页面快照", tag:"新写", st:"new", what:"按 AI 键时生成：成员、页面、可见内容与定位器、选区、可用动作、页面代次；≤ 8 KB 分层截断。任何页面至少有系统从控件树生成的通用快照。", why:["R-021","F-11"], learn:"Apple AppEntity 关联视图；Android AssistStructure；私密页面只给头信息（FLAG_SECURE 思路）。", v01:"阅读、听、报纸、单词、设置五类页面有语义快照；其他页面用控件树快照兜底；私密页面范围待 D-23。", risk:"生成耗时与内存（模拟器先测）。"},
  "cap-policy": {n:"策略闸门", tag:"新写", st:"new", what:"每次动作执行前检查：成员、儿童白名单、确认等级、限速、页面代次与对象版本。", why:["R-014","R-030","G-002"], learn:"上游固件“隐藏工具”调用时不检查，属于安全缺陷；Windows：agent 最小权限。", v01:"儿童默认禁止设置、升级、删除、对外通信、任意网址导入。", risk:"—"},
  "cap-receipt": {n:"回执与撤销", tag:"新写", st:"new", what:"回执：完成/排队/待确认/拒绝/过期/失败/取消/已撤销，受影响对象，可撤销期限，一句可播报的 say。", why:["SR-AI-02","G-002"], learn:"Gemini：停止不等于回滚；Duolingo：页面继续走不代表已保存；墨墨：按实际成功数量报告。", v01:"请求 ID 幂等；限时撤销。", risk:"—"},

function renderDetail(){
  const c = C[current];
  const stCls = c.st === "port" ? "st-port" : c.st === "later" ? "st-later" : "st-new";
  $("#detail").innerHTML = `
    <div class="detail-head"><h3>${c.n}</h3><span class="status ${stCls}">${c.tag}</span></div>
    <div class="facets">
      <div class="facet"><b>负责什么</b><p>${c.what}</p></div>
      <div class="facet"><b>为什么需要</b><p>${c.why.map(w => `<span class="pill">${w}</span>`).join("")}</p></div>
      <div class="facet"><b>别人怎么做 / 教训</b><p>${c.learn}</p></div>
      <div class="facet"><b>首版做到哪</b><p>${c.v01}</p></div>
      <div class="facet"><b>风险与待验证</b><p>${c.risk}</p></div>
    </div>`;
  document.querySelectorAll("[data-id]").forEach(b => b.setAttribute("aria-pressed", b.dataset.id === current));
}
function renderScenarios(){
  $("#scn").innerHTML = SCENARIOS.map(s => `<button type="button" data-scn="${s.id}" aria-pressed="false">${s.n}</button>`).join("");
}
function renderSteps(){
  document.querySelectorAll("[data-scn]").forEach(b => b.setAttribute("aria-pressed", b.dataset.scn === (scenario && scenario.id)));
  document.querySelectorAll(".chip, .link button").forEach(b => b.classList.remove("lit"));
  if (!scenario){ $("#steps").innerHTML = ""; $("#scn-note").textContent = "选一个场景，看一次真实操作会经过哪些部分。"; return; }
  $("#scn-note").textContent = scenario.note;
  scenario.steps.forEach(([id]) => document.querySelectorAll(`[data-id="${id}"]`).forEach(b => b.classList.add("lit")));
  $("#steps").innerHTML = scenario.steps.map(([id, t, sub], i) =>
    `<button type="button" class="step" data-step="${i}" data-target="${id}" aria-current="${i === stepIdx}"><span>${t}<small>${C[id].n} · ${sub}</small></span></button>`).join("");
}
function renderPlan(){
  $("#plan").innerHTML = PLAN.map(p => `<div class="wk${p.hw ? " hw" : ""}"><b>${p.w}</b><span class="mono">${p.d}</span><ul>${p.items.map(i => `<li>${i}</li>`).join("")}</ul></div>`).join("");
}
document.addEventListener("click", e => {
  const s = e.target.closest("[data-scn]");
  if (s){ const next = SCENARIOS.find(x => x.id === s.dataset.scn); scenario = scenario && scenario.id === next.id ? null : next; stepIdx = -1; renderSteps(); return; }
  const st = e.target.closest("[data-step]");
  if (st){ stepIdx = +st.dataset.step; current = st.dataset.target; renderDetail(); renderSteps(); return; }
  const b = e.target.closest("[data-id]");
  if (b){ current = b.dataset.id; renderDetail(); }
});
renderMap(); renderDetail(); renderScenarios(); renderSteps(); renderPlan();
</script>
