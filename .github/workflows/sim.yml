name: sim

# Builds the simulator and the portable system on Linux and macOS and runs
# every scenario against its budgets. No hardware needed. Linux is the
# reference; macOS (Apple clang, arm64) is where the desktop simulator is used.
# Linux links the system SDL2; macOS builds the pinned SDL2 from source, the
# path a Mac without Homebrew's SDL2 takes, so both branches stay covered.
on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fonts for the CJK bitmap font generator, SDL2 for the desktop simulator
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-cjk python3-pil libsdl2-dev
      - name: Configure (warnings are errors)
        run: cmake -S . -B build -DINK_WERROR=ON
      - name: Build
        run: cmake --build build -j
      - name: Scenarios and budgets
        run: ctest --test-dir build --output-on-failure
      - name: HTML reports (what the simulated panel showed, latencies, CPU, memory)
        if: always()
        run: |
          for d in build/test-out/*/; do
            [ -f "$d/metrics.json" ] && python3 tools/simreport/simreport.py "$d" --lang zh || true
          done
      - name: Sanitizers (ASan + UBSan)
        run: |
          cmake -S . -B build-asan -DINK_SANITIZE=ON
          cmake --build build-asan -j
          ctest --test-dir build-asan --output-on-failure
      - name: Keep reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sim-reports
          path: build/test-out
          retention-days: 14

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pillow for the font generator
        run: python -m pip install pillow
      - name: Noto Sans CJK (release Sans2.004, checked by hash)
        run: |
          mkdir -p fonts
          curl -sSL -o fonts/NotoSansCJK-Regular.ttc https://github.com/notofonts/noto-cjk/raw/Sans2.004/Sans/OTC/NotoSansCJK-Regular.ttc
          echo "b76b0433203017ca80401b2ee0dd69350349871c4b19d504c34dbdd80541690a  fonts/NotoSansCJK-Regular.ttc" | shasum -a 256 -c
      - name: Configure (warnings are errors)
        run: cmake -S . -B build -DINK_WERROR=ON -DINK_CJK_FONT=$PWD/fonts/NotoSansCJK-Regular.ttc -DINK_CJK_FACE=2 -DPython3_EXECUTABLE=$(which python) -DCMAKE_DISABLE_FIND_PACKAGE_SDL2=ON
      - name: Build
        run: cmake --build build -j
      - name: Scenarios and budgets
        run: ctest --test-dir build --output-on-failure
