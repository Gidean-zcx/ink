# ESP32-S31 timing model for the iss simulator: BASE assumptions.
#
# calibrate.sh starts from this file, fits the free core parameters (marked
# "fitted") to the CoreMark anchor inside a physically plausible box, fits the
# PSRAM line-fill time to measured ESP32-P4 memcpy rates, and writes the full
# result to tools/iss/out/esp32s31.fitted.cfg. Units: CPU cycles at cpu.mhz.
# Sources and reasoning: docs/research/simulator/iss-calibration.md

cpu.mhz = 320

# --- integer pipeline: 5-stage, in order, single issue (datasheet v0.5) ---
lat.alu = 1
lat.load_word = 2          # one load-use bubble (classic 5-stage; E51/U54: 2-cycle word loads)
lat.load_sub = 3           # fitted in {2, 3}  (U54: 3 for byte/half loads)
lat.mul = 2                # fitted in {1, 2}
lat.csr_read = 3           # U54-like
occ.div = 34               # radix-2 divider, no early out (pessimistic)
occ.csr_write = 5          # pipeline flush (U54: five-cycle)
occ.fence_i = 5
occ.amo = 3
mem.misaligned_extra = 1   # split access

# --- FPU, single precision. No public figures: GCC -mtune=esp-base costs
# --- (which Espressif copied from Rocket) are used as latencies.
lat.fp_add = 4
lat.fp_mul = 4
lat.fp_fma = 5
lat.fp_misc = 2
lat.fp_load = 2
occ.fp_div = 20
occ.fp_sqrt = 20

# --- branch prediction: datasheet says BHT + BTB + RAS, sizes unpublished;
# --- SiFive E51/U54 sizes (28-entry BTB, 512-entry BHT, 6-entry RAS) assumed.
bp.enable = 1
bp.bht_entries = 512
bp.btb_entries = 28
bp.ras_entries = 6
br.taken_correct = 0       # BTB/RAS hit: no bubble (U54: "no penalty")
br.mispredict = 3          # fitted in {2, 3}  (U54: three-cycle)
br.jal_nobtb = 3           # fitted in {1, 3}  (decode redirect .. resolved like a mispredict)

# --- memory map and caches (ESP-IDF master: soc.h, Kconfig.cache, rom/cache.h)
mem.sram_kib = 512
mem.flash_kib = 16384
mem.psram_kib = 8192
mem.sram_extra = 0         # internal SRAM is not cached; accessed at pipeline speed
icache.enable = 1
icache.size = 16384        # per core: CACHE_L1_ICACHE_SIZE 0x4000 (datasheet: "32 KB")
icache.line = 64
icache.ways = 2
dcache.enable = 1
dcache.size = 65536        # one D-cache shared by both cores
dcache.line = 64
dcache.ways = 2
dcache.hit_extra = 0

# --- external memory (blocking misses, no critical-word-first, no prefetch,
# --- write-back + write-allocate D-cache)
flash.fill = 1150          # 64 B over DIO 80 MHz flash (upstream sdkconfig): ~3.6 us
psram.fill = 96            # theory only (octal DDR 200 MHz, IDF AP-octal timing, ~300 ns); fitted
psram.writeback = 85       # theory (write latency 7 clk, ~265 ns); raised by the fit if needed
